# vite.config.js 의 dev proxy 규칙을 운영에서 재현한다:
#   /api/recommend, /api/portfolio → 추천서비스(FastAPI, 8000)
#   그 외 /api                     → 백엔드(Spring Boot, 8080)
#   그 외 전부                     → 프론트 정적 파일
# 컨테이너 재시작으로 IP가 바뀌어도 매 요청마다 재조회하도록 변수+resolver로 proxy_pass 한다
# (docker-compose 서비스명을 그대로 호스트명으로 씀 — 127.0.0.11 은 Docker 내장 DNS).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /api/recommend {
        set $upstream_reco recommend-service:8000;
        proxy_pass http://$upstream_reco;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/portfolio {
        set $upstream_reco recommend-service:8000;
        proxy_pass http://$upstream_reco;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api {
        set $upstream_backend backend:8080;
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
