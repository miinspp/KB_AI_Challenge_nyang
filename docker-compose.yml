# 단일 EC2 인스턴스 배포용. 루트 .env 파일에서 변수를 읽는다(.env.production.example 참고).
#   docker compose up -d --build
services:
  backend:
    build:
      context: ./backend
    environment:
      TXN_CORRECTIONS_FILE: /data/txn/corrections.jsonl
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    volumes:
      - txn_data:/data/txn
    restart: unless-stopped

  recommend-service:
    build:
      context: .
      dockerfile: recommend-service/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PORTFOLIO_ADVISOR_MODEL: ${PORTFOLIO_ADVISOR_MODEL:-claude-sonnet-5}
      SPRING_BASE: http://backend:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # 설정 시 컨테이너 시작 시 s3://.../ko-sroberta-reco 등을 pipeline/models 로 받아온다.
      # 미설정이면 engine.py 가 bge-m3 공개모델로 자동 폴백(최초 기동 시 ~2GB 다운로드).
      MODEL_S3_URI: ${MODEL_S3_URI:-}
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - recommend-service
    restart: unless-stopped

volumes:
  txn_data:
