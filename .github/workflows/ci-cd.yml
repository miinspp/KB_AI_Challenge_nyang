name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        working-directory: backend
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  recommend-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        working-directory: recommend-service
        run: python -m py_compile app.py engine.py portfolio_advisor.py

  deploy:
    needs: [backend, frontend, recommend-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # 임시 진단 — SSH 타임아웃(dial i/o timeout)의 원인을 러너에서 직접 가른다.
      #   80 성공 + 22 실패 → 주소는 맞고 보안 그룹이 22번을 막는 것
      #   둘 다 실패      → EC2_HOST 값이 안 닿는 주소(사설 IP/구 IP)
      # 시크릿은 길이·사설IP여부·해시 앞 8자리만 찍어 값 자체는 노출하지 않는다.
      - name: Diagnose SSH reachability
        continue-on-error: true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "EC2_HOST 길이: ${#EC2_HOST} (54.116.249.2 라면 12)"
          echo "EC2_HOST 지문: $(printf %s "$EC2_HOST" | sha256sum | cut -c1-8)"
          case "$EC2_HOST" in
            10.*|172.1[6-9].*|172.2[0-9].*|172.3[0-1].*|192.168.*|ip-*)
              echo "판정: 사설 IP/사설 DNS — 인터넷에서 도달 불가" ;;
            *) echo "판정: 사설 IP 아님" ;;
          esac
          for port in 22 80; do
            if nc -vz -w 5 "$EC2_HOST" "$port" 2>&1; then
              echo "  → $port 연결 성공"
            else
              echo "  → $port 연결 실패(타임아웃/차단)"
            fi
          done

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
