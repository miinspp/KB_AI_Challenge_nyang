name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # 배포(deploy)는 이 수동 실행에서만 동작한다 — 아래 deploy 잡 참고

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & test
        working-directory: backend
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  recommend-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        working-directory: recommend-service
        run: python -m py_compile app.py engine.py portfolio_advisor.py

  # EC2 인스턴스를 정리하면서 자동 배포는 껐다(로컬 실행으로 전환). 배포 절차 자체는 언제든
  # 서버를 다시 세울 수 있도록 그대로 남겨두고, Actions 탭의 "Run workflow"(수동 실행)에서만
  # 동작하게 한다. 그래서 main 에 push 해도 이 잡은 건너뛰고 CI 는 초록으로 유지된다.
  # 서버를 되살릴 때는 EC2_HOST 등 시크릿을 새 주소로 갱신한 뒤 수동 실행하면 된다.
  deploy:
    needs: [backend, frontend, recommend-service]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            # 빌드 전에 공간을 확보한다 — 디스크가 차서 레이어 추출이 실패한 전례가 있다.
            # 빌드 캐시와 dangling 이미지만 지우므로 실행 중인 컨테이너는 건드리지 않는다.
            # --volumes 는 절대 붙이지 말 것: txn_data(corrections.jsonl)가 날아간다.
            docker builder prune -af
            docker image prune -f
            df -h /
            docker compose up -d --build
            docker image prune -f
